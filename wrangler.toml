# Cloudflare configuration. Resource IDs are placeholders: create resources with the commands in docs/DEPLOYMENT.md.
name = "house-cleaning-management"
account_id = "38447d80d8f04048737c82c96665f780"
main = "worker/src/index.ts"
compatibility_date = "2025-07-18"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]   # API links opened directly (exports, photos, attachments) must reach the Worker, not the SPA fallback

[[d1_databases]]
binding = "DB"
database_name = "hcm-db"
database_id = "00000000-0000-0000-0000-000000000000"   # replace after `wrangler d1 create hcm-db`
migrations_dir = "migrations"

[[r2_buckets]]
binding = "FILES"
bucket_name = "hcm-files"

[triggers]
crons = ["*/15 * * * *"]   # message expiry, recurring horizon, recurring expenses, company purge, key re-encryption, rate-limit pruning

# Realtime chat hub (one Durable Object per company, WebSocket hibernation)
[[durable_objects.bindings]]
name = "REALTIME"
class_name = "RealtimeHub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RealtimeHub"]

# Optional features — uncomment when enabled (see docs/DEPLOYMENT.md):
# [ai]                      # Workers AI, used for on-demand message translation (paid usage beyond free allocation)
# binding = "AI"
# Secrets (wrangler secret put): ENCRYPTION_KEY, ENCRYPTION_KEY_PREVIOUS, TURNSTILE_SECRET, WHATSAPP_TOKEN
# Vars: ENCRYPTION_KEY_VERSION, TURNSTILE_SITE_KEY, WHATSAPP_PHONE_NUMBER_ID, PURGE_AFTER_DAYS

[vars]
APP_ENV = "development"

[env.staging]
name = "house-cleaning-management-staging"
vars = { APP_ENV = "staging" }
[[env.staging.d1_databases]]
binding = "DB"
database_name = "hcm-db-staging"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"
[[env.staging.r2_buckets]]
binding = "FILES"
bucket_name = "hcm-files-staging"
[env.staging.triggers]
crons = ["*/15 * * * *"]
[[env.staging.durable_objects.bindings]]
name = "REALTIME"
class_name = "RealtimeHub"
# [env.staging.ai]
# binding = "AI"
